<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="description" content="The personal website of Jonathan Poltak Samosir." />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="google-site-verification"
            content="zlktUFsvmhc6B88ieLOt2j2H7QJqbHbLoJXXnN49LjE"
        />
        <script>
            // Apply the saved theme before first paint. The layout keeps it in sync afterwards.
            // Keep the theme ids the same as THEMES in src/lib/theme.ts.
            ;(function () {
                var root = document.documentElement
                var theme = null
                var mode = null
                try {
                    theme = localStorage.getItem('theme')
                    mode = localStorage.getItem('color-mode')
                } catch (error) {
                    // Blocked storage: use the defaults.
                }
                root.dataset.theme = /^(cyan|acid|amber|magenta|red|teal|violet)$/.test(theme)
                    ? theme
                    : 'cyan'
                if (mode !== 'light' && mode !== 'dark') {
                    mode = window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark'
                        : 'light'
                }
                root.classList.toggle('dark', mode === 'dark')
            })()
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div class="site">%sveltekit.body%</div>
    </body>
</html>
